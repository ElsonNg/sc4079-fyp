<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__REPORT_TITLE__</title>
  <style>__REPORT_STYLES__</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div><a class="brand" href="#">provtrail</a><span class="subtitle">Code security review</span></div>
    <div class="actions">
      <button id="scan-info" class="button">Scan details</button>
      <button id="theme-toggle" class="button" aria-pressed="false">Dark theme</button>
    </div>
  </header>

  <section class="summary" aria-labelledby="project-title">
    <div class="summary-head"><div><p class="eyebrow">Known vulnerable code · JavaScript / TypeScript</p><h1 id="project-title"></h1><p id="summary-meta" class="muted"></p></div></div>
    <p id="coverage-warning" class="notice" hidden></p>
    <div class="counters" aria-label="Filter findings by decision">
      <button class="counter vulnerable" data-filter="vulnerable" aria-pressed="false"><span>Vulnerable matches</span><strong id="count-vulnerable">0</strong><small>Exact or inferred code matches</small></button>
      <button class="counter review" data-filter="manual_review" aria-pressed="false"><span>Review required</span><strong id="count-review">0</strong><small>Vulnerability not established</small></button>
      <button class="counter patched" data-filter="patched" aria-pressed="false"><span>Patched matches</span><strong id="count-patched">0</strong><small>Patched side of a known fix</small></button>
    </div>
    <p class="scope-note">Matches describe known upstream fixes. Runtime reachability and other vulnerabilities are not established by this scan.</p>
  </section>

  <section class="workspace" aria-label="Review findings">
    <div class="toolbar">
      <div class="search-field">
        <label class="sr-only" for="search">Search findings</label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Search functions, CVEs, packages or paths">
      </div>
      <label for="view-filter" class="sr-only">Result view</label>
      <select id="view-filter">
        <option value="attention">Needs attention</option><option value="all">All matches</option>
        <option value="vulnerable">Vulnerable matches</option><option value="manual_review">Review required</option><option value="patched">Patched matches</option>
      </select>
      <button id="clear-filter" class="button">Reset filters</button>
    </div>
    <aside class="sidebar" aria-label="Browse by file">
      <button class="file-overview button" id="overview">All matching findings</button>
      <div class="sidebar-head"><strong>Project files</strong><span id="tree-count" class="muted"></span></div>
      <label class="toggle"><input id="show-all-files" type="checkbox"> Show files without matching findings</label>
      <nav id="tree" class="tree" aria-label="Project files"></nav>
    </aside>
    <article id="content" class="content" aria-label="Findings"></article>
  </section>
  <noscript>This offline report requires JavaScript. Use the JSON, SARIF or AI report to read findings without JavaScript.</noscript>
</main>

<dialog id="finding-info-dialog" aria-labelledby="finding-info-title">
  <div class="dialog-head"><div><h2 id="finding-info-title">Boundary evidence</h2><p id="finding-info-location" class="muted"></p></div><form method="dialog"><button class="button">Close</button></form></div>
  <div id="finding-info-body" class="dialog-body"></div>
</dialog>
<dialog id="comparison-dialog" aria-labelledby="comparison-title">
  <div class="dialog-head"><div><h2 id="comparison-title">Complete source comparison</h2><p id="comparison-location" class="muted"></p></div><form method="dialog"><button class="button">Close</button></form></div>
  <div class="comparison-controls" role="group" aria-label="Comparison references">
    <button class="button" data-comparison-mode="patched" aria-pressed="true">Project vs patched</button>
    <button class="button" data-comparison-mode="vulnerable" aria-pressed="false">Project vs vulnerable</button>
    <button class="button" data-comparison-mode="all" aria-pressed="false">All three</button>
  </div>
  <div id="comparison-body" class="dialog-body"></div>
</dialog>
<dialog id="scan-info-dialog" aria-labelledby="scan-info-title">
  <div class="dialog-head"><h2 id="scan-info-title">Scan details</h2><form method="dialog"><button class="button">Close</button></form></div>
  <div id="scan-info-body" class="dialog-body"></div>
</dialog>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>__REPORT_SCRIPT__</script>
</body>
</html>
