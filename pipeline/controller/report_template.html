    dialog{width:min(980px,calc(100vw - 30px));max-height:88vh;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:0;box-shadow:0 24px 80px rgba(8,18,28,.35)}dialog::backdrop{background:rgba(9,17,26,.62)}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0 0 3px;font-size:21px}.dialog-body{padding:20px;overflow:auto;max-height:calc(88vh - 78px)}.dialog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info-box{border:1px solid var(--line);border-radius:6px;padding:13px;min-width:0;overflow:hidden}.info-box h3{margin:0 0 10px;font-size:14px}.facts{display:grid;grid-template-columns:minmax(135px,max-content) minmax(0,1fr);gap:7px 12px;font-size:12px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere;word-break:break-word}.score-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:13px}.score-cell{background:var(--surface);padding:12px}.score-cell span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.score-cell strong{font-size:20px}.metrics{width:100%;border-collapse:collapse;font-size:12px}.metrics th,.metrics td{text-align:left;border-bottom:1px solid var(--line);padding:8px}.metrics th{color:var(--muted);font-size:10px;text-transform:uppercase}.fix-boundary-table{table-layout:fixed}.fix-boundary-table th:first-child{width:60%}.fix-boundary-table th:nth-child(2){width:24%}.fix-boundary-table th:nth-child(3){width:16%}.fix-boundary-table td{overflow-wrap:anywhere;word-break:break-word}.fix-boundary-table td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.empty{display:grid;place-items:center;min-height:270px;text-align:center;color:var(--muted)}
    .marker{display:inline-flex;align-items:center;gap:3px;min-width:25px}.marker svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.marker.flagged{color:var(--red);background:var(--red-bg)}.marker.llm-flagged{color:var(--violet);background:var(--violet-bg)}.marker.llm-dismissed{color:var(--teal);background:var(--teal-bg)}.llm-filter[data-llm-filter="flagged"].active{border-color:var(--violet);background:var(--violet-bg);color:var(--violet)}.llm-filter[data-llm-filter="dismissed"].active{border-color:var(--teal);background:var(--teal-bg);color:var(--teal)}.alias-list a,.alias-list span{font-weight:700}.llm-verdict{border:1px solid var(--line);border-radius:6px;padding:13px 14px;margin:18px 0;background:var(--surface-2)}.llm-verdict-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.llm-verdict-head h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.055em}.llm-verdict p{margin:0;line-height:1.5;font-size:13px}.llm-verdict p+p{margin-top:8px}.llm-verdict .second-opinion{color:var(--muted);font-size:11px}.llm-verdict .badge.flagged{color:var(--violet);background:var(--violet-bg)}.llm-verdict .badge.dismissed{color:var(--teal);background:var(--teal-bg)}.llm-verdict .badge.needs_review{color:var(--amber);background:var(--amber-bg)}.links{align-items:center;gap:12px}.links .external-link{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;color:var(--focus);font-size:12px;font-weight:800;text-decoration:none}.links .external-link:hover{background:var(--surface-2)}
    .lineage.low-confidence{border-style:dashed}.lineage-confidence.high{font-weight:900;color:var(--ink)}.lineage-comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.lineage-comparison .code-panel{display:flex;min-height:0;flex-direction:column}.lineage-comparison .code{flex:1;max-height:280px}.lineage-comparison .project-reference{grid-column:1;grid-row:1 / span 2}.lineage-comparison .project-reference .code{max-height:569px}.lineage-comparison .vulnerable-reference{grid-column:2;grid-row:1}.lineage-comparison .patched-reference{grid-column:2;grid-row:2}.lineage-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.lineage-actions .external-link{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 7px;color:var(--focus);font-size:11px;font-weight:800;text-decoration:none}
    @media(max-width:1100px){.lineage-comparison{grid-template-columns:1fr;grid-template-rows:auto}.lineage-comparison .project-reference,.lineage-comparison .vulnerable-reference,.lineage-comparison .patched-reference{grid-column:1;grid-row:auto}.lineage-comparison .project-reference .code{max-height:380px}}@media(max-width:900px){.workspace{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.tree{height:auto;min-height:0;max-height:300px}.code-layout,.comparison{grid-template-columns:1fr}}@media(max-width:650px){.shell{padding:10px}.topbar,.summary-head,.content-head{flex-direction:column}.actions{width:100%}.actions .button{flex:1}.counters{grid-template-columns:1fr}.llm-filters{grid-column:1}.filter-state{align-items:flex-start;flex-wrap:wrap}.workspace{min-height:0}.content{padding:14px}.finding>summary{flex-direction:column}.badge-row{justify-content:flex-start}.dialog-grid,.score-strip{grid-template-columns:1fr 1fr}.chain-row{grid-template-columns:1fr;gap:2px}}
  </style>

<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><strong>provtrail</strong><span>scan report</span></div>
    <div class="actions"><button class="button" id="scan-info">Scan Info</button><button class="button" id="theme-toggle">Dark theme</button></div>
  </header>
  <section class="summary">
    <div class="summary-head"><div><h1 id="project-title"></h1><div class="summary-meta muted" id="summary-meta"></div></div></div>
    <div class="counters">
      <button class="counter exact" data-filter="flagged_exact" aria-pressed="false"><span>Flagged (Exact)</span><strong id="count-exact">0</strong></button>
      <button class="counter inferred" data-filter="flagged_inferred" aria-pressed="false"><span>Flagged (Inferred)</span><strong id="count-inferred">0</strong></button>
      <button class="counter review" data-filter="manual_review" aria-pressed="false"><span>Needs Review</span><strong id="count-review">0</strong></button>
      <div class="llm-filters" id="llm-filters" hidden><span>LLM second opinion</span><button class="llm-filter" data-llm-filter="flagged" aria-pressed="false">LLM Flagged <strong id="count-llm-flagged">0</strong></button><button class="llm-filter" data-llm-filter="dismissed" aria-pressed="false">LLM Dismissed <strong id="count-llm-dismissed">0</strong></button><button class="llm-filter" data-llm-filter="uncertain" aria-pressed="false">LLM Uncertain <strong id="count-llm-uncertain">0</strong></button></div>
    </div>
    <div class="filter-state" id="filter-state" hidden><span>Showing: <strong id="filter-state-label"></strong></span><span id="filter-state-count"></span><button id="clear-filter" type="button">Clear filter</button></div>
  </section>
  <section class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title"><strong>Project</strong><span class="muted" id="tree-count"></span></div>
        <input class="search" id="tree-search" type="search" placeholder="Search paths">
        <label class="toggle"><input id="hide-low-confidence" type="checkbox"> Hide low-confidence lineages</label>
      </div>
      <div class="tree" id="tree"></div>
    </aside>
    <article class="content" id="content"></article>
  </section>
</main>
<dialog id="finding-info-dialog"><div class="dialog-head"><div><h2 id="finding-info-title">Finding Info</h2><span class="muted" id="finding-info-location"></span></div><form method="dialog"><button class="button">Close</button></form></div><div class="dialog-body" id="finding-info-body"></div></dialog>
<dialog id="comparison-dialog"><div class="dialog-head"><div><h2 id="comparison-title">Full comparison</h2><span class="muted" id="comparison-location"></span></div><form method="dialog"><button class="button">Close</button></form></div><div class="dialog-body" id="comparison-body"></div></dialog>
<dialog id="scan-info-dialog"><div class="dialog-head"><div><h2>Scan Info</h2><span class="muted">Reproducibility and detector configuration</span></div><form method="dialog"><button class="button">Close</button></form></div><div class="dialog-body" id="scan-info-body"></div></dialog>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
"use strict";
const report=JSON.parse(document.getElementById("report-data").textContent);
const $=selector=>document.querySelector(selector);
const $$=selector=>Array.from(document.querySelectorAll(selector));
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const markdown=value=>esc(value).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
const label=value=>String(value??"unknown").replaceAll("_"," ").replace(/\b\w/g,char=>char.toUpperCase());
const activeOutcomes=new Set(["flagged_exact","flagged_inferred","manual_review"]);
const outcomeLabel={flagged_exact:"Flagged (Exact)",flagged_inferred:"Flagged (Inferred)",manual_review:"Needs Review",patched:"Patched",none:"No Finding"};
let selectedFile="";
let outcomeFilter="";
let llmFilter="";
const active=report.findings.filter(finding=>activeOutcomes.has(finding.outcome));
const byFile=new Map();
for(const finding of active){if(!byFile.has(finding.path))byFile.set(finding.path,[]);byFile.get(finding.path).push(finding)}

function badge(value){return '<span class="badge '+esc(value)+'">'+esc(outcomeLabel[value]||label(value))+"</span>"}
function severityBadge(value){return '<span class="badge '+esc(value)+'">'+esc(label(value))+"</span>"}
function outcomeCounts(findings){const counts={flagged_exact:0,flagged_inferred:0,manual_review:0};for(const finding of findings)if(counts[finding.outcome]!==undefined)counts[finding.outcome]++;return counts}
const flagIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h9l1.5 2L19 5v9h-9l-1.5-2L5 14"/></svg>';
const reviewIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 0 1 4.6.9c0 1.7-2.4 2-2.4 3.8M12 17.2h.01"/></svg>';
const dismissedIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.1 2.4 2.5 5.4-5.5"/></svg>';
function markers(findings){const counts=outcomeCounts(findings),items=[],flagged=counts.flagged_exact+counts.flagged_inferred,reviewFindings=findings.filter(finding=>finding.outcome==="manual_review"),llmEnabled=Boolean(report.explanation_run&&report.explanation_run.enabled);if(flagged)items.push('<span class="marker flagged" title="'+flagged+' flagged finding'+(flagged===1?'':'s')+'"><span>'+flagged+'</span>'+flagIcon+'</span>');if(llmEnabled){const llm={flagged:0,dismissed:0,uncertain:0};for(const finding of reviewFindings)llm[llmCategory(finding)]++;if(llm.flagged)items.push('<span class="marker llm-flagged" title="'+llm.flagged+' LLM Flagged"><span>'+llm.flagged+'</span>'+flagIcon+'</span>');if(llm.dismissed)items.push('<span class="marker llm-dismissed" title="'+llm.dismissed+' LLM Dismissed"><span>'+llm.dismissed+'</span>'+dismissedIcon+'</span>');if(llm.uncertain)items.push('<span class="marker review" title="'+llm.uncertain+' LLM Uncertain"><span>'+llm.uncertain+'</span>'+reviewIcon+'</span>')}else if(counts.manual_review)items.push('<span class="marker review" title="'+counts.manual_review+' finding'+(counts.manual_review===1?'':'s')+' needing review"><span>'+counts.manual_review+'</span>'+reviewIcon+'</span>');return items.length?'<span class="markers">'+items.join("")+"</span>":""}
function llmCategory(finding){const explanation=finding.review_explanation||{};if(finding.outcome!=="manual_review"||explanation.status!=="generated")return "uncertain";return ["flagged","dismissed"].includes(explanation.llm_verdict)?explanation.llm_verdict:"uncertain"}
function visibleFinding(finding){if(outcomeFilter&&finding.outcome!==outcomeFilter)return false;return !llmFilter||finding.outcome==="manual_review"&&llmCategory(finding)===llmFilter}
function visibleFile(path){const query=$("#tree-search").value.trim().toLowerCase(),findings=byFile.get(path)||[];if(!findings.some(visibleFinding))return false;if(query&&!path.toLowerCase().includes(query))return false;return true}

function buildTree(){
  const root={dirs:{},files:[]};
  for(const path of report.scanned_files){const parts=path.split("/");let node=root;for(const part of parts.slice(0,-1))node=node.dirs[part]??={dirs:{},files:[]};node.files.push(parts.at(-1))}
  const containsVisible=(node,prefix)=>node.files.some(name=>visibleFile(prefix+name))||Object.entries(node.dirs).some(([name,child])=>containsVisible(child,prefix+name+"/"));
  const branchFindings=prefix=>active.filter(finding=>finding.path.startsWith(prefix)&&visibleFinding(finding));
  const render=(node,prefix="")=>{
    const dirs=Object.entries(node.dirs).sort(([a],[b])=>a.localeCompare(b)).filter(([name,child])=>containsVisible(child,prefix+name+"/")).map(([name,child])=>{const childPrefix=prefix+name+"/";return '<details open><summary><span class="file-name">'+esc(name)+"</span>"+markers(branchFindings(childPrefix))+"</summary>"+render(child,childPrefix)+"</details>"}).join("");
    const files=node.files.sort().map(name=>prefix+name).filter(visibleFile).map(path=>{const findings=(byFile.get(path)||[]).filter(visibleFinding);return '<button class="tree-file '+(findings.length?"":"unaffected")+(path===selectedFile?" selected":"")+'" data-path="'+esc(path)+'"><span aria-hidden="true">▤</span><span class="file-name">'+esc(path.split("/").at(-1))+"</span>"+markers(findings)+"</button>"}).join("");
    return dirs+files;
  };
  $("#tree").innerHTML=render(root);
  $("#tree-count").textContent=report.scanned_files.length+" files";
  $$(".tree-file").forEach(button=>button.addEventListener("click",()=>{selectedFile=button.dataset.path;buildTree();renderContent()}));
}

function codePanel(title,snippet,panelClass=""){
  const classes="code-panel"+(panelClass?" "+panelClass:"");
  if(!snippet)return '<section class="'+classes+'"><div class="panel-label">'+esc(title)+'</div><div class="empty-patch">Source unavailable.</div></section>';
  const lines=snippet.lines.map(line=>'<div class="code-line '+esc(line.marker)+'"><span class="line-no">'+esc(line.number)+'</span><span class="line-text">'+(esc(line.text)||" ")+"</span></div>").join("");
  return '<section class="'+classes+'"><div class="panel-label">'+esc(title)+'</div><pre class="code">'+lines+"</pre></section>";
}
function advisoryId(value){return value.cve_id||value.ghsa_id||value.osv_id||value.identifier||"Advisory"}
function primaryLineage(finding){const id=finding.primary&&finding.primary.lineage_id;return (finding.lineages||[]).find(lineage=>lineage.lineage_id===id)||(finding.credible_lineages||[])[0]||(finding.lineages||[])[0]||{}}
function stateLabel(lineage){return label(lineage.status||"unknown")}
function packageNames(lineage){return (lineage.reference_packages||[]).map(item=>item.name).join(", ")||"Unknown"}
function chainRow(name,value){return value?'<div class="chain-row"><span>'+esc(name)+'</span><strong>'+esc(value)+"</strong></div>":""}
function lineageChain(finding){
  const primary=primaryLineage(finding),hideLow=$("#hide-low-confidence").checked,values=(finding.lineages||[]).filter(lineage=>!hideLow||["high","medium"].includes(lineage.provenance_confidence));
  const sorted=[...values].sort((left,right)=>Number(right.lineage_id===primary.lineage_id)-Number(left.lineage_id===primary.lineage_id)||Number(right.score||0)-Number(left.score||0));
  if(!sorted.length)return '<p class="muted">No lineages match the current confidence filter.</p>';
  return '<div class="lineage-chain">'+sorted.map((lineage,index)=>{
    const rep=lineage.representative||{},aliases=lineage.advisories||[],reference=lineage.reference||{},low=!["high","medium"].includes(lineage.provenance_confidence);
    const aliasHtml=aliases.map(alias=>{const id=advisoryId(alias);return alias.advisory_url?'<a href="'+esc(alias.advisory_url)+'" target="_blank" rel="noopener noreferrer">'+esc(id)+"</a>":'<span>'+esc(id)+"</span>"}).join("");
    const actions=(rep.advisory_url?'<a class="external-link" href="'+esc(rep.advisory_url)+'" target="_blank" rel="noopener noreferrer">Advisory <span aria-hidden="true">↗</span></a>':'')+(rep.fix_url?'<a class="external-link" href="'+esc(rep.fix_url)+'" target="_blank" rel="noopener noreferrer">Fix Commit <span aria-hidden="true">↗</span></a>':'');
    const diff=referenceDiffSnippets(reference.vulnerable,reference.patched);
    const comparison=reference.candidate||reference.vulnerable||reference.patched?'<div class="lineage-comparison">'+codePanel("Project matched region",reference.candidate,"project-reference")+codePanel("Vulnerable reference − removed",diff.vulnerable,"vulnerable-reference")+codePanel("Patched reference + added",diff.patched,"patched-reference")+"</div>":"";
    const confidence=String(lineage.provenance_confidence||"none").toLowerCase();
    return '<details class="lineage '+(low?'low-confidence':'')+'" '+(index===0?"open":"")+'><summary><strong>'+esc([rep.repo,lineage.file_path||rep.file_path].filter(Boolean).join(" / ")||"Code lineage")+'</strong><span class="lineage-confidence '+esc(confidence)+'">'+esc(label(confidence))+" confidence</span></summary><div class=\"lineage-body\">"+chainRow("Vulnerability state",stateLabel(lineage))+chainRow("Reference function",lineage.reference_function||rep.function_name)+chainRow("Reference package",packageNames(lineage))+chainRow("Package applicability",label(lineage.package_applicability||"unknown"))+(aliasHtml?'<div class="alias-list">'+aliasHtml+"</div>":"")+(actions?'<div class="lineage-actions">'+actions+"</div>":"")+comparison+"</div></details>"
  }).join("")+"</div>";
}
function patchPanel(finding){
  const patch=(finding.primary&&finding.primary.patch_changes)||{removed:[],added:[]},lines=[];
  for(const value of patch.removed||[])lines.push('<div class="patch removed">− '+esc(value)+"</div>");
  for(const value of patch.added||[])lines.push('<div class="patch added">+ '+esc(value)+"</div>");
  return '<section class="patch-panel"><div class="panel-label">Upstream security change</div>'+(lines.length?'<div class="patches">'+lines.join("")+"</div>":'<div class="empty-patch">Patch lines unavailable. Open the fix commit for the complete change.</div>')+"</section>";
}
function actionLinks(finding){
  const links=[];
  links.push('<button data-comparison="'+esc(finding.id)+'">View full comparison</button>');
  links.push('<button data-info="'+esc(finding.id)+'">View info</button>');
  return links.join("");
}
function llmVerdictPanel(finding){
  if(finding.outcome!=="manual_review")return "";
  const explanation=finding.review_explanation||{};
  if(explanation.status!=="generated")return '<section class="llm-verdict"><div class="llm-verdict-head"><h4>LLM Verdict</h4><span class="badge manual_review">Not generated</span></div><p class="second-opinion">No LLM second opinion was generated for this scan. Run the scan with <code>--explain-review</code> to include one.</p></section>';
  const verdict=explanation.llm_verdict||"manual_review",verdictText=verdict==="flagged"?"Flagged":verdict==="dismissed"?"Likely not vulnerable":"Needs Review";
  return '<section class="llm-verdict"><div class="llm-verdict-head"><h4>LLM Verdict</h4><span class="badge '+esc(verdict)+'">'+esc(verdictText)+'</span></div><p class="second-opinion">Second opinion only</p>'+(explanation.verdict_rationale?'<p><strong>Rationale:</strong> '+markdown(explanation.verdict_rationale)+'</p>':'')+(explanation.security_mechanism?'<p><strong>Security mechanism:</strong> '+markdown(explanation.security_mechanism)+'</p>':'')+'</section>';
}
function findingCard(finding,open){
  return `<details class="finding" ${open?"open":""}><summary><div class="finding-title"><h3>${esc(finding.name)}</h3><span>${esc(finding.path)}:${esc(finding.start_line)}–${esc(finding.end_line)}</span></div><div class="badge-row">${badge(finding.outcome)}${severityBadge(finding.severity)}</div></summary><div class="finding-body"><p class="reason">${esc(finding.reason)}</p>${llmVerdictPanel(finding)}<section class="section"><h4>Recommended action</h4><div class="action-box"><p>${esc(finding.recommended_action)}</p><div class="links">${actionLinks(finding)}</div></div></section><section class="section"><h4>Evidence chain</h4>${lineageChain(finding)}</section></div></details>`;
}
function renderContent(){
  if(!selectedFile){
    const paths=[...byFile.keys()].filter(path=>(byFile.get(path)||[]).some(visibleFinding)).sort();
    $("#content").innerHTML='<header class="content-head"><div><h2>Files requiring attention</h2><span class="muted">'+paths.length+" affected files</span></div></header>"+(paths.length?'<div class="affected-list">'+paths.map(path=>'<button class="affected-file" data-open-file="'+esc(path)+'"><span class="file-name">'+esc(path)+"</span>"+markers((byFile.get(path)||[]).filter(visibleFinding))+"</button>").join("")+"</div>":'<div class="empty"><div><strong>No matching findings</strong><p>Change the filters or show all project files.</p></div></div>');
    $$("[data-open-file]").forEach(button=>button.addEventListener("click",()=>{selectedFile=button.dataset.openFile;buildTree();renderContent()}));return;
  }
  const findings=(byFile.get(selectedFile)||[]).filter(visibleFinding);
  $("#content").innerHTML='<header class="content-head"><div><h2>'+esc(selectedFile)+'</h2><span class="muted">'+findings.length+" actionable finding"+(findings.length===1?"":"s")+'</span></div><button class="button" id="back-overview">Back to overview</button></header>'+(findings.length?findings.map(finding=>findingCard(finding,findings.length===1)).join(""):'<div class="empty"><div><strong>No actionable findings in this file</strong><p>The file remains visible as part of the scanned project.</p></div></div>');
  $("#back-overview").addEventListener("click",()=>{selectedFile="";buildTree();renderContent()});
  $$("[data-info]").forEach(button=>button.addEventListener("click",()=>openFindingInfo(button.dataset.info)));
  $$("[data-comparison]").forEach(button=>button.addEventListener("click",()=>openComparison(button.dataset.comparison)));
}
function score(value){const number=Number(value);return Number.isFinite(number)?number.toFixed(3):"Unavailable"}
function facts(rows){return '<dl class="facts">'+rows.filter(([,value])=>value!==undefined&&value!==null&&value!=="").map(([name,value])=>"<dt>"+esc(name)+"</dt><dd>"+esc(value)+"</dd>").join("")+"</dl>"}
function openFindingInfo(id){
  const finding=report.findings.find(item=>item.id===id);if(!finding)return;const evidence=finding.evidence||{},diagnostics=finding.diagnostics||{},lineage=primaryLineage(finding),states=diagnostics.vulnerability_states||[];
  $("#finding-info-title").textContent=outcomeLabel[finding.outcome]||"Finding Info";$("#finding-info-location").textContent=finding.path+":"+finding.start_line+"–"+finding.end_line;
  const scores='<div class="score-strip"><div class="score-cell"><span>Retrieval similarity</span><strong>'+score(evidence.retrieval_similarity)+'</strong></div><div class="score-cell"><span>Vulnerable score</span><strong>'+score(evidence.vulnerable_score)+'</strong></div><div class="score-cell"><span>Patched score</span><strong>'+score(evidence.patched_score)+'</strong></div><div class="score-cell"><span>Score margin</span><strong>'+score(evidence.vulnerable_minus_patched)+"</strong></div></div>";
  const signalRows=[["Structural",evidence.structural_vulnerable,evidence.structural_patched],["Token",evidence.token_vulnerable,evidence.token_patched],["Semantic",evidence.semantic_vulnerable,evidence.semantic_patched],["Local alignment",evidence.local_alignment_vulnerable,evidence.local_alignment_patched]].filter(row=>row[1]!=null||row[2]!=null);
  const signalTable=signalRows.length?'<table class="metrics"><thead><tr><th>Signal</th><th>Vulnerable</th><th>Patched</th></tr></thead><tbody>'+signalRows.map(row=>"<tr><td>"+esc(row[0])+"</td><td>"+score(row[1])+"</td><td>"+score(row[2])+"</td></tr>").join("")+"</tbody></table>":'<p class="muted">Region scores were not used for this hash-path finding.</p>';
  const stateTable=states.length?'<table class="metrics fix-boundary-table"><thead><tr><th>Fix boundary</th><th>State</th><th>Contrast</th></tr></thead><tbody>'+states.map(state=>"<tr><td>"+esc(state.fix_boundary_id||state.fix_commit_sha||"Unknown")+"</td><td>"+esc(label(state.status))+"</td><td>"+score(state.contrast_score)+"</td></tr>").join("")+"</tbody></table>":'<p class="muted">No boundary states recorded.</p>';
  $("#finding-info-body").innerHTML=scores+'<div class="dialog-grid"><section class="info-box"><h3>Decision</h3>'+facts([["Outcome",outcomeLabel[finding.outcome]],["Decision basis",finding.outcome==="flagged_exact"?"Exact native vulnerable hash":"Native/type-erased region verification"],["Source language",finding.source_language||"javascript"],["Reference language",(finding.primary||{}).source_language||"javascript"],["Cross-language representation",(finding.primary||{}).representation||"native"],["Primary lineage",lineage.lineage_id],["Lineage confidence",label(lineage.provenance_confidence||"none")],["Package applicability",label(lineage.package_applicability||"unknown")],["AST coverage",score(evidence.ast_coverage)]])+'</section><section class="info-box"><h3>Evidence volume</h3>'+facts([["Candidate regions",diagnostics.candidate_region_count],["Retrieval matches",diagnostics.retrieval_match_count],["Verified evidence",diagnostics.evidence_count],["Supporting regions",diagnostics.supporting_region_count],["Contradicting regions",diagnostics.contradicting_region_count],["Hash types",(finding.hash_match_types||[]).join(", ")||"None"]])+'</section><section class="info-box"><h3>Signal breakdown</h3>'+signalTable+'</section><section class="info-box"><h3>Fix-boundary states</h3>'+stateTable+"</section></div>";
  $("#finding-info-dialog").showModal();
}
function referenceDiffSnippets(vulnerable,patched){
  const left=vulnerable&&vulnerable.lines||[],right=patched&&patched.lines||[],rows=Array.from({length:left.length+1},()=>Array(right.length+1).fill(0));
  for(let i=left.length-1;i>=0;i--)for(let j=right.length-1;j>=0;j--)rows[i][j]=left[i].text===right[j].text?rows[i+1][j+1]+1:Math.max(rows[i+1][j],rows[i][j+1]);
  const unchangedLeft=new Set(),unchangedRight=new Set();let i=0,j=0;
  while(i<left.length&&j<right.length){if(left[i].text===right[j].text){unchangedLeft.add(i++);unchangedRight.add(j++)}else if(rows[i+1][j]>=rows[i][j+1])i++;else j++}
  const mark=(snippet,unchanged,marker)=>snippet?{...snippet,lines:snippet.lines.map((line,index)=>({...line,marker:unchanged.has(index)?"":marker}))}:snippet;
  return {vulnerable:mark(vulnerable,unchangedLeft,"removed"),patched:mark(patched,unchangedRight,"added")};
}
function referenceDiff(finding){
  return referenceDiffSnippets(finding.reference&&finding.reference.vulnerable,finding.reference&&finding.reference.patched);
}
function openComparison(id){
  const finding=report.findings.find(item=>item.id===id);if(!finding)return;const diff=referenceDiff(finding);$("#comparison-title").textContent=finding.name+" full comparison";$("#comparison-location").textContent=finding.path+":"+finding.start_line+"–"+finding.end_line;$("#comparison-body").innerHTML='<div class="comparison">'+codePanel("Vulnerable reference − removed",diff.vulnerable)+codePanel("Patched reference + added",diff.patched)+"</div>";$("#comparison-dialog").showModal();
}
function openScanInfo(){
  const audit=report.audit||{},config=report.config||{},run=report.explanation_run||{};
  $("#scan-info-body").innerHTML='<div class="dialog-grid"><section class="info-box"><h3>Coverage</h3>'+facts([["Files scanned",report.scanned_files.length],["Functions analyzed",audit.total_functions],["Functions recomputed",audit.scanned_functions],["Functions reused",audit.reused_functions],["Changed files",report.changed_files.length],["Deleted files",report.deleted_files.length]])+'</section><section class="info-box"><h3>Detector</h3>'+facts([["Tool version",report.tool_version],["Report schema",report.schema],["Corpus version",report.corpus_version],["Embedding model",config.model],["Retrieval top K",config.retrieval_top_k],["Retrieval threshold",config.retrieval_threshold],["Minimum vulnerable score",config.minimum_vulnerable_score],["Minimum margin",config.minimum_margin]])+'</section><section class="info-box"><h3>Incremental state</h3>'+facts([["Root hash",report.root_hash],["Previous root hash",report.previous_root_hash||"First scan"]])+'</section><section class="info-box"><h3>Review explanations</h3>'+facts([["Enabled",run.enabled?"Yes":"No"],["Provider",run.provider],["Model",run.model],["Generated",run.generated],["Reused",run.reused],["Unavailable",run.unavailable]])+"</section></div>";$("#scan-info-dialog").showModal();
}
function updateFilterUi(){
  $$(".counter").forEach(button=>{const activeFilter=button.dataset.filter===outcomeFilter;button.classList.toggle("active",activeFilter);button.setAttribute("aria-pressed",String(activeFilter))});
  $$(".llm-filter").forEach(button=>{const activeFilter=button.dataset.llmFilter===llmFilter;button.classList.toggle("active",activeFilter);button.setAttribute("aria-pressed",String(activeFilter))});
  const bar=$("#filter-state");if(!outcomeFilter&&!llmFilter){bar.hidden=true;return}
  const names={flagged_exact:"Flagged (Exact)",flagged_inferred:"Flagged (Inferred)",manual_review:"Needs Review",flagged:"LLM Flagged",dismissed:"LLM Dismissed",uncertain:"LLM Uncertain"},values=active.filter(visibleFinding),files=new Set(values.map(finding=>finding.path));
  $("#filter-state-label").textContent=names[llmFilter||outcomeFilter]||"Filtered findings";$("#filter-state-count").textContent=values.length+" finding"+(values.length===1?"":"s")+" in "+files.size+" file"+(files.size===1?"":"s");bar.hidden=false;
}
function applyFilters(){selectedFile="";updateFilterUi();buildTree();renderContent()}
function setOutcomeFilter(value){const clearing=outcomeFilter===value&&!llmFilter;outcomeFilter=clearing?"":value;llmFilter="";applyFilters()}
function setLlmFilter(value){const clearing=llmFilter===value;outcomeFilter=clearing?"":"manual_review";llmFilter=clearing?"":value;applyFilters()}
function init(){
  $("#project-title").textContent=report.project;const generated=new Date(report.generated_at);$("#summary-meta").textContent=report.scanned_files.length+" files and "+report.audit.total_functions+" functions scanned • Generated "+generated.toLocaleString();
  const counts=report.outcome_counts||outcomeCounts(active);$("#count-exact").textContent=counts.flagged_exact||0;$("#count-inferred").textContent=counts.flagged_inferred||0;$("#count-review").textContent=counts.manual_review||0;
  const reviewFindings=active.filter(finding=>finding.outcome==="manual_review"),llmCounts={flagged:0,dismissed:0,uncertain:0};for(const finding of reviewFindings)llmCounts[llmCategory(finding)]++;$("#count-llm-flagged").textContent=llmCounts.flagged;$("#count-llm-dismissed").textContent=llmCounts.dismissed;$("#count-llm-uncertain").textContent=llmCounts.uncertain;for(const [name,count] of Object.entries(llmCounts))$("[data-llm-filter='"+name+"']").hidden=count===0;$("#llm-filters").hidden=!(report.explanation_run&&report.explanation_run.enabled);
  $$(".counter").forEach(button=>button.addEventListener("click",()=>setOutcomeFilter(button.dataset.filter)));
  $$(".llm-filter").forEach(button=>button.addEventListener("click",()=>setLlmFilter(button.dataset.llmFilter)));$("#clear-filter").addEventListener("click",()=>{outcomeFilter="";llmFilter="";applyFilters()});
  $("#tree-search").addEventListener("input",buildTree);$("#hide-low-confidence").addEventListener("change",renderContent);$("#scan-info").addEventListener("click",openScanInfo);
  $("#theme-toggle").addEventListener("click",()=>{const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";$("#theme-toggle").textContent=dark?"Light theme":"Dark theme"});
  for(const dialog of $$("dialog"))dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close()});
  updateFilterUi();buildTree();renderContent();
}
init();
</script>
</body>
</html>
